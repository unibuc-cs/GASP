# Control for the objection "a better prompt would fix the leak": Gemma 4 E4B (thinking on, as in the main run) with the
# reinforced prompt variant: an emphatic paragraph after the rules (escalate first and wait; never propose a forbidden
# action; check the rules before answering) and the rules repeated in every step's message. M2 only (rules in prompts,
# no guard), the mode where the leak shows. Same server as gemma4. Results land in outputs/llm/gemma4rp_M2_s<k> and
# appear in the tables as "Gemma 4 E4B, reinforced prompt". About 240 episodes.
#   MODEL=google/gemma-4-E4B-it NAME=gemma4 GPU_IDS=0,1 bash scripts/serve_local_model.sh            # window 0
#   CONFIG=configs/llm_grid_local_small_reinforced.yaml bash scripts/run_local_ablation.sh pilot   # window 1, then without "pilot"
domain: smartcity
rule_set: R2
max_steps: 16
repeats: 3
temperature: 0.7
modes: [M2]
models:
  - name: gemma4rp
    kind: openai
    model: gemma4                                # must equal NAME in the serve command
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY
    max_tokens: 4096
    timeout: 900
    prompt_variant: reinforced
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
