# Second local model, the small end of the size axis: Gemma 4 E4B (Google, Apache 2.0, about 4.5B effective parameters,
# released April 2026; vLLM 0.19.1 or newer). Served with
#   MODEL=google/gemma-4-E4B-it NAME=gemma4 GPU_IDS=2 PORT=8010 bash scripts/serve_local_model.sh
# and run with
#   CONFIG=configs/llm_grid_local_small.yaml bash scripts/run_local_ablation.sh pilot     (then without "pilot")
# Same scenarios, rules, horizon and temperature as the other models; all five modes so the size axis is complete.
domain: smartcity
rule_set: R2
max_steps: 16
repeats: 3
temperature: 0.7
modes: [M0, M1, M2, M3, M4]
models:
  - name: gemma4                               # the model name in every table
    kind: openai
    model: gemma4                              # must equal NAME in the serve command
    base_url: http://localhost:8010/v1         # found automatically by served name; this is only the fallback
    api_key_env: LOCAL_API_KEY
    max_tokens: 4096                           # room for the model's thinking before the JSON answer
    timeout: 900
    extra_body:
      chat_template_kwargs:
        enable_thinking: true                  # Gemma 4 thinks only when asked per request (vLLM recipe); the gemma4
                                               # reasoning parser keeps the thinking out of the answer text
