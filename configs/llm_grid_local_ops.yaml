# Glimmer on the second domain (software incident response): same modes and settings as configs/llm_grid_local.yaml,
# different scenarios and rules triggers. The run script sends the results to outputs/llm_ops/local_<mode>_s<k> and
# uses outputs/paper_ops/scenarios.json, so the city tables are untouched.
#   GPU_IDS=0,1 bash scripts/serve_local_model.sh                                        # window 0 (Glimmer)
#   CONFIG=configs/llm_grid_local_ops.yaml bash scripts/run_local_ablation.sh pilot      # window 1, then without "pilot"
domain: ops
rule_set: R2
max_steps: 16
repeats: 3
temperature: 0.7
modes: [M2, M3, M4]
models:
  - name: glimmer
    kind: openai
    model: glimmer
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY
    max_tokens: 4096
    timeout: 900
    system_prefix: "Reasoning strength: high\n"
