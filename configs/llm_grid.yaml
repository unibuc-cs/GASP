# LLM experiment grid. Both models are OpenAI API models; nothing runs locally and no GPU is needed.
# The key is read from the environment variable OPENAI_API_KEY on the machine that runs the grid.
domain: smartcity
rule_set: R2
max_steps: 16
repeats: 5
temperature: 0.7
modes: [M0, M1, M2, M3, M4]
models:
  - name: sol            # frontier model: GPT-6 Sol, 2 USD / 10 USD per million input / output tokens
    kind: openai
    model: gpt-6-sol
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  - name: luna           # efficient model: GPT-6 Luna, 0.10 USD / 0.50 USD per million tokens; used for every sensitivity sweep
    kind: openai
    model: gpt-6-luna
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
# Other models: one entry each, same fields. The `model` value must be the exact identifier from the provider's model
# list. An OpenAI model is `kind: openai` with OPENAI_API_KEY; a Claude model is `kind: anthropic` with ANTHROPIC_API_KEY
# (`pip install anthropic` once). The grid runs every entry in this list; use --models name1,name2 to run a subset.
