# Dry run of the pilot without any model: two "models" that answer like a perfectly compliant policy in JSON.
# Used to produce the example pilot report and to test the pipeline end to end. No API calls.
domain: smartcity
rule_set: R2
max_steps: 16
repeats: 1
temperature: 0.7
modes: [M0, M1, M2, M3, M4]
models:
  - name: sol
    kind: procedural-json
  - name: luna
    kind: procedural-json
