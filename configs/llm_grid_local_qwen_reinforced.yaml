# The same control for Qwen3.5-122B-A10B, the model whose prompted roles skipped approvals: reinforced prompt variant
# (escalate first and wait; never propose a forbidden action; rules repeated at every step), reasoning off as in the
# main run. M2 only. Results land in outputs/llm/qwen122brp_M2_s<k>, in the tables as "Qwen3.5-122B, reinforced prompt".
# Request settings must equal the main Qwen run (configs/mimic/llm_grid_mimic.yaml): check max_tokens and enable_thinking.
#   MODEL=Qwen/Qwen3.5-122B-A10B NAME=qwen122b QUANT=fp8 LAYOUT=tp GPU_IDS=0,1 bash scripts/serve_local_model.sh   # window 0
#   CONFIG=configs/llm_grid_local_qwen_reinforced.yaml bash scripts/run_local_ablation.sh pilot                     # window 1, then without "pilot"
domain: smartcity
rule_set: R2
max_steps: 16
repeats: 3
temperature: 0.7
modes: [M2]
models:
  - name: qwen122brp
    kind: openai
    model: qwen122b                              # must equal NAME in the serve command
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY
    max_tokens: 1024
    timeout: 900
    prompt_variant: reinforced
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
