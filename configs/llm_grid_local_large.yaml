# Third local model, the large end of the size axis: gpt-oss-120b (OpenAI, Apache 2.0, 117B parameters with 5B active,
# weights in MXFP4, about 63 GB: one copy per H100). Served with
#   MODEL=openai/gpt-oss-120b NAME=gptoss120b GPU_IDS=0,1 PORT=8000 bash scripts/serve_local_model.sh
# (the script adds the vLLM recipe's --max-num-batched-tokens 1024 and memory setting for one H100) and run with
#   CONFIG=configs/llm_grid_local_large.yaml bash scripts/run_local_ablation.sh pilot     (then without "pilot")
domain: smartcity
rule_set: R2
max_steps: 16
repeats: 3
temperature: 0.7
modes: [M0, M1, M2, M3, M4]
models:
  - name: gptoss120b                           # the model name in every table
    kind: openai
    model: gptoss120b                          # must equal NAME in the serve command
    base_url: http://localhost:8000/v1         # found automatically by served name; this is only the fallback
    api_key_env: LOCAL_API_KEY
    max_tokens: 4096
    timeout: 900
    json_mode: false                           # no response_format for gpt-oss: with its harmony format vLLM applies the
                                               # JSON constraint from the first token and drops the reasoning
    extra_body:
      reasoning_effort: high                   # gpt-oss takes its level (low/medium/high) as a request field; if the
                                               # server rejects it, the backend drops it and the manifest says so
