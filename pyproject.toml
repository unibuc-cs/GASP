[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gasp"
version = "2.0.0"
description = "Governed agent societies: runtime governance and trace metrics for LLM-driven multi-agent systems (SEAMS 2027 artifact)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "PyYAML>=6.0", "scipy>=1.10", "requests>=2.28"]

[tool.setuptools.packages.find]
include = ["gasp*"]
